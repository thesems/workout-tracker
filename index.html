<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13">
<title>Lift — Workout Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--surface:#151a22;--surface2:#1c2330;--line:#2b3442;--text:#f4f6fa;--muted:#96a2b3;--blue:#528cff;--blue2:#3571ee;--green:#35c18a;--red:#ff7070;--radius:15px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{padding-bottom:104px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.app{max-width:650px;margin:auto;padding:23px 18px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:27px;font-weight:800;letter-spacing:-1.2px}.brand span{color:var(--blue)}.top-meta{font-size:12px;color:var(--muted)}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}p{margin:0}.muted{color:var(--muted)}.sub{font-size:14px;color:var(--muted);line-height:1.5}.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}.section-head h2{margin:0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.card-title{font-size:17px;font-weight:730;letter-spacing:-.25px}.small{font-size:12px}.meta{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.4}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--surface2);color:var(--text);font-weight:650;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:var(--blue2)}.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}.btn.danger{color:var(--red);background:transparent}.btn.sm{padding:8px 10px;font-size:13px}.btn.wide{width:100%}.btn:active{transform:scale(.985)}.pill{font-size:12px;border:1px solid var(--line);border-radius:100px;padding:5px 9px;color:var(--muted)}.empty{border:1px dashed var(--line);padding:29px 18px;text-align:center;border-radius:var(--radius);color:var(--muted);line-height:1.6}.nav{position:fixed;bottom:0;left:0;right:0;background:#121720ec;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;z-index:20}.nav-inner{max-width:650px;display:flex;width:100%;justify-content:space-between;gap:6px}.nav button{border:0;background:none;color:var(--muted);padding:8px 5px;min-width:65px;font-size:11px;display:grid;justify-items:center;gap:4px;border-radius:9px}.nav button.active{color:var(--blue);background:#528cff14}.nav svg{height:21px;width:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.exercise-card{padding:15px;margin:13px 0}.exercise-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.exercise-name{font-weight:720;font-size:16px}.set-table{width:100%;border-collapse:separate;border-spacing:5px 8px;text-align:center;margin:0 -5px;width:calc(100% + 10px)}.set-table th{color:var(--muted);font-size:11px;font-weight:600}.set-table td{font-size:14px}.set-table input{width:100%;min-width:0;max-width:125px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 2px;text-align:center;outline:none}.set-table input:focus,.field:focus{border-color:var(--blue)}.set-table tr.done input{opacity:.55}.set-no{color:var(--muted);font-weight:600;width:24px}.check{height:35px;width:35px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;color:var(--muted);font-size:17px}.check.checked{background:var(--green);border-color:var(--green);color:#061910}.xbtn{padding:4px 7px;border:none;background:none;color:var(--muted);font-size:17px}.add-set{font-size:13px;padding:9px 8px;color:var(--blue);background:transparent;border:none;width:100%;margin-top:6px}.workout-banner{background:linear-gradient(130deg,#1c3358,#152134);border:1px solid #32507c;padding:17px;border-radius:15px;margin:20px 0}.workout-banner h2{margin-bottom:7px}.field{display:block;width:100%;padding:12px 13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}.field-label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.form-group{margin-bottom:16px}.modal-back{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{background:#161c25;width:100%;max-width:650px;border-radius:22px 22px 0 0;border:1px solid var(--line);padding:22px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-size:20px;margin:0}.library-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}.library-item:last-child{border:none}.search{margin:0 0 12px}.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);color:var(--muted);padding:5px 8px;border-radius:6px;font-size:11px}.right{margin-left:auto}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{background:var(--surface);padding:15px 10px;border:1px solid var(--line);border-radius:12px}.stat strong{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted);margin-top:4px;display:block}.action-row{display:flex;gap:8px;flex-wrap:wrap}.template-ex{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:8px}.template-ex:last-child{border:0}.notice{padding:12px 14px;border:1px solid #39567f;background:#17263b;border-radius:10px;margin:14px 0;font-size:13px;color:#c6dbff}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);padding:11px 16px;background:#edf2fa;color:#151b23;border-radius:10px;z-index:45;font-size:13px;box-shadow:0 5px 40px #0009;white-space:nowrap}.date{font-size:12px;color:var(--muted)}.history-detail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;line-height:1.7}.history-detail b{font-weight:650}@media(max-width:385px){.app{padding:19px 12px}.card{padding:12px}.btn{padding:10px}.set-table{border-spacing:3px 7px}}
</style>
</head>
<body><div id="app" class="app"></div><div id="nav" class="nav"></div><div id="overlay"></div><div id="toast"></div>
<script>
(()=>{'use strict';
const DB_NAME='lift-local-v1',DB_VERSION=1,stores=['exercises','templates','workouts','state'];let db;let page='home',modal=null,active=null,templates=[],exercises=[],workouts=[],editingTemplate=null,selectedIds=[],searchText='';
const seedEx=['Single-arm Cable Row','Seated Leg Press','Leg Extension','Incline Dumbbell Press','Triceps Pushdown','Romanian Deadlift','Dumbbell Overhead Press','Dumbbell Bicep Curl','Assisted Pull-up','Face Pull','Decline Crunch','Bulgarian Split Squat','Seated Leg Curl','Machine Chest Press','Cable Lateral Raise','Seated Calf Raise','Abdominal Crunch Machine'];
const seedTemplates=[{name:'Workout A',ids:[0,1,2,3,4],sets:[4,3,3,3,3]},{name:'Workout B',ids:[5,6,7,8,9,10],sets:[3,3,3,3,3,2]},{name:'Workout C',ids:[11,12,13,14,15,16],sets:[3,3,3,3,3,3]}];
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const fmt=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});const duration=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`};
const transact=(store,mode,act)=>new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),os=tx.objectStore(store);let result;try{result=act(os)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(result?.result);tx.onerror=()=>reject(tx.error)});
const getAll=store=>transact(store,'readonly',os=>os.getAll());const get=(store,key)=>transact(store,'readonly',os=>os.get(key));const put=(store,val)=>transact(store,'readwrite',os=>os.put(val));const del=(store,key)=>transact(store,'readwrite',os=>os.delete(key));
async function init(){db=await new Promise((res,rej)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{for(const s of stores)if(!req.result.objectStoreNames.contains(s))req.result.createObjectStore(s,{keyPath:'id'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});if(!(await get('state','initialized'))){for(const e of seedEx)await put('exercises',{id:uid(),name:e});const ex=await getAll('exercises');for(const t of seedTemplates)await put('templates',{id:uid(),name:t.name,items:t.ids.map((idx,i)=>({exerciseId:ex.find(x=>x.name===seedEx[idx]).id,setCount:t.sets[i]}))});await put('state',{id:'initialized',value:true})}await reload();active=(await get('state','draft'))?.value||null;render()}
async function reload(){[templates,exercises,workouts]=await Promise.all([getAll('templates'),getAll('exercises'),getAll('workouts')]);templates.sort((a,b)=>a.name.localeCompare(b.name));exercises.sort((a,b)=>a.name.localeCompare(b.name));workouts.sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))}
function exName(id){return exercises.find(x=>x.id===id)?.name||'Deleted exercise'}function notify(msg){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${escape(msg)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.innerHTML='',2500)}
function icon(name){const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/>',templates:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 18-6-6 6-6"/>'};return `<svg viewBox="0 0 24 24">${paths[name]||paths.plus}</svg>`}
function nav(){document.getElementById('nav').innerHTML=`<div class="nav-inner">${[['home','Home'],['templates','Templates'],['history','History'],['more','More']].map(([key,label])=>`<button class="${page===key?'active':''}" data-nav="${key}">${icon(key)}${label}</button>`).join('')}</div>`}
function templateCard(t){return `<div class="card"><div class="row between"><div><div class="card-title">${escape(t.name)}</div><div class="meta">${t.items.map(i=>exName(i.exerciseId)).map(escape).join(' · ')||'No exercises yet'}</div></div><button class="btn primary sm" data-start="${t.id}">Start</button></div><div class="action-row" style="margin-top:13px"><button class="btn ghost sm" data-edit-template="${t.id}">Edit template</button><span class="pill">${t.items.length} exercises</span></div></div>`}
function renderHome(){const latest=workouts[0];return `<div class="row between"><div><h1>Let's lift.</h1><p class="sub">Your training, saved on this device.</p></div></div>${active?`<div class="workout-banner"><h2>Workout in progress</h2><p class="sub">${escape(active.name)} · ${active.items.length} exercises</p><button class="btn primary wide" style="margin-top:14px" data-view-workout>Resume workout</button></div>`:`<button class="btn primary wide" style="margin-top:20px" data-start-blank>+ Start empty workout</button>`}<div class="section-head"><h2>Templates</h2><button class="btn ghost sm" data-nav="templates">See all</button></div><div class="stack">${templates.map(templateCard).join('')}</div>${latest?`<div class="section-head"><h2>Last workout</h2></div><div class="card"><div class="card-title">${escape(latest.name)}</div><div class="meta">${fmt(latest.endedAt)} · ${latest.items.length} exercises · ${duration(new Date(latest.endedAt)-new Date(latest.startedAt))}</div></div>`:''}`}
function renderTemplates(){return `<div class="row between" style="margin-bottom:22px"><div><h1>Templates</h1><p class="sub">Your reusable routines.</p></div><button class="btn primary sm" data-new-template>+ New</button></div><div class="stack">${templates.map(templateCard).join('')||'<div class="empty">No templates yet.</div>'}</div>`}
function renderWorkout(){if(!active)return renderHome();return `<div class="row between"><div><div class="date">LIVE WORKOUT</div><h1 style="margin-top:5px">${escape(active.name)}</h1><div class="meta">Started ${new Date(active.startedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div><button class="btn sm" data-rename-workout>Edit name</button></div><div class="notice">Your progress is saved automatically in IndexedDB.</div>${active.items.map((item,i)=>renderExercise(item,i)).join('')}<button class="btn wide" data-add-workout-exercise>+ Add exercise</button><div class="action-row" style="margin-top:20px"><button class="btn primary" style="flex:2" data-finish>Finish workout</button><button class="btn danger" data-discard>Discard</button></div>`}
function renderExercise(item,i){return `<div class="card exercise-card"><div class="exercise-top"><span class="exercise-name">${escape(exName(item.exerciseId))}</span><button class="xbtn" title="Remove exercise" data-remove-ex="${i}">×</button></div><table class="set-table"><thead><tr><th style="width:9%">SET</th><th style="width:36%">KG</th><th style="width:36%">REPS</th><th style="width:19%">✓</th></tr></thead><tbody>${item.sets.map((set,j)=>`<tr class="${set.done?'done':''}"><td class="set-no">${j+1}</td><td><input aria-label="Weight in kilograms, set ${j+1}" type="number" min="0" max="9999" step="0.5" inputmode="decimal" placeholder="—" value="${escape(set.kg??'')}" data-set-input="${i}:${j}:kg"></td><td><input aria-label="Repetitions, set ${j+1}" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="—" value="${escape(set.reps??'')}" data-set-input="${i}:${j}:reps"></td><td><button class="check ${set.done?'checked':''}" title="Mark set complete" data-check="${i}:${j}">✓</button></td></tr>`).join('')}</tbody></table><div class="row between"><button class="add-set" data-add-set="${i}">+ Add set</button><button class="btn ghost sm" data-remove-set="${i}" title="Remove last set">− Last set</button></div></div>`}
function renderHistory(){const totalSets=workouts.reduce((n,w)=>n+w.items.reduce((a,x)=>a+x.sets.filter(s=>s.done).length,0),0);return `<h1>History</h1><p class="sub">Every completed session.</p><div class="stat-grid"><div class="stat"><strong>${workouts.length}</strong><span>Workouts</span></div><div class="stat"><strong>${totalSets}</strong><span>Completed sets</span></div><div class="stat"><strong>${new Set(workouts.flatMap(w=>w.items.map(x=>x.exerciseId))).size}</strong><span>Exercises used</span></div></div><div class="stack">${workouts.map(w=>`<div class="card"><div class="row between"><div><div class="card-title">${escape(w.name)}</div><div class="meta">${fmt(w.endedAt)} · ${duration(new Date(w.endedAt)-new Date(w.startedAt))}</div></div><button class="btn sm" data-history-toggle="${w.id}">Details</button></div><div class="history-detail" id="history-${w.id}" hidden>${w.items.map(x=>`<div style="margin-bottom:8px"><b>${escape(exName(x.exerciseId))}</b><div class="muted">${x.sets.filter(s=>s.done).map(s=>`${s.kg??'—'} kg × ${s.reps??'—'}`).join(' · ')||'No completed sets'}</div></div>`).join('')}<button class="btn danger sm" data-delete-workout="${w.id}">Delete workout</button></div></div>`).join('')||'<div class="empty">No completed workouts yet. Start a template to log your first session.</div>'}</div>`}
function renderMore(){return `<h1>Settings</h1><p class="sub">Everything stays on your device unless you export it.</p><div class="section-head"><h2>Exercise library</h2><button class="btn ghost sm" data-new-exercise>+ Add</button></div><div class="card"><div class="row between"><span>${exercises.length} exercises</span><button class="btn sm" data-library>Manage</button></div></div><div class="section-head"><h2>Your data</h2></div><div class="card stack"><button class="btn wide" data-export>Export JSON backup</button><button class="btn wide" data-import>Import JSON backup</button><p class="sub small">Import replaces existing templates, exercises and workout history. Export first if you want a backup.</p></div><div class="section-head"><h2>About</h2></div><p class="sub">Lift is a minimal, offline-first workout logger. Data is stored using IndexedDB in this browser. Clearing browser website data or using private browsing can erase it.</p><input type="file" id="import-file" accept="application/json,.json" hidden></div>`}
function render(){nav();document.getElementById('app').innerHTML=`<header class="top"><div class="brand">lift<span>.</span></div><div class="top-meta">LOCAL-FIRST TRAINING</div></header>`+(active&&page==='workout'?renderWorkout():page==='templates'?renderTemplates():page==='history'?renderHistory():page==='more'?renderMore():renderHome());renderModal()}
function showModal(type,data={}){modal={type,...data};searchText='';renderModal()}
function renderModal(){const root=document.getElementById('overlay');if(!modal){root.innerHTML='';return}let body='',title='';if(modal.type==='library-select'){title='Add exercises';body=`<input class="field search" id="exercise-search" placeholder="Search exercises..." value="${escape(searchText)}"><div id="exercise-results">${exerciseChoices()}</div><button class="btn wide" style="margin-top:13px" data-new-exercise>+ Create custom exercise</button>`}else if(modal.type==='new-exercise'){title='New exercise';body=`<div class="form-group"><label class="field-label">Exercise name</label><input class="field" id="new-ex-name" placeholder="e.g. Lat Pulldown" maxlength="100" autofocus></div><button class="btn primary wide" data-save-new-exercise>Save exercise</button>`}else if(modal.type==='template'){title=editingTemplate?'Edit template':'New template';body=`<div class="form-group"><label class="field-label">Template name</label><input class="field" id="template-name" maxlength="80" value="${escape(editingTemplate?.name||'')}"></div><div class="section-head"><h2>Exercises</h2><button class="btn sm" data-template-add>+ Add</button></div><div id="template-ex-list">${selectedIds.map((x,i)=>`<div class="template-ex"><span>${escape(exName(x.exerciseId))}</span><div class="row"><input class="field" style="width:70px;padding:7px;text-align:center" type="number" min="1" max="20" aria-label="Sets for ${escape(exName(x.exerciseId))}" data-template-sets="${i}" value="${x.setCount}"><button class="xbtn" data-template-remove="${i}">×</button></div></div>`).join('')||'<p class="sub">No exercises added.</p>'}</div><button class="btn primary wide" style="margin-top:22px" data-save-template>Save template</button>${editingTemplate?'<button class="btn danger wide" style="margin-top:8px" data-delete-template>Delete template</button>':''}`}
else if(modal.type==='library'){title='Exercise library';body=`<input class="field search" id="exercise-search" placeholder="Search exercises..." value="${escape(searchText)}"><div id="exercise-results">${exerciseChoices()}</div><button class="btn primary wide" style="margin-top:15px" data-new-exercise>+ New exercise</button>`}
else if(modal.type==='rename'){title='Workout name';body=`<input class="field" id="workout-name" value="${escape(active?.name||'')}"><button class="btn primary wide" style="margin-top:14px" data-save-name>Save</button>`}
root.innerHTML=`<div class="modal-back" data-close-backdrop><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="btn sm" data-close-modal>Close</button></div>${body}</div></div>`;const f=root.querySelector('.modal');f?.addEventListener('click',e=>e.stopPropagation())}
function exerciseChoices(){const query=searchText.toLowerCase().trim(),list=exercises.filter(x=>x.name.toLowerCase().includes(query));return list.map(x=>`<div class="library-item"><span>${escape(x.name)}</span>${modal.type==='library'?`<button class="btn danger sm" data-delete-exercise="${x.id}">Delete</button>`:`<button class="btn sm" data-pick-exercise="${x.id}">Add</button>`}</div>`).join('')||'<div class="empty">No exercises found.</div>'}
async function persistDraft(){await put('state',{id:'draft',value:active})}
async function start(templateId){if(active&&!confirm('Discard the current workout and start another?'))return;const t=templates.find(x=>x.id===templateId);active={id:uid(),templateId:templateId||null,name:t?.name||'Empty Workout',startedAt:new Date().toISOString(),items:(t?.items||[]).map(x=>({exerciseId:x.exerciseId,sets:Array.from({length:x.setCount||3},()=>({kg:null,reps:null,done:false}))}))};await persistDraft();page='workout';render()}
function templateEditor(t){editingTemplate=t||null;selectedIds=(t?.items||[]).map(x=>({...x}));showModal('template')}
async function saveTemplate(){const name=document.getElementById('template-name')?.value.trim();if(!name){notify('Enter a template name');return}const t={id:editingTemplate?.id||uid(),name,items:selectedIds.map(x=>({...x,setCount:Math.max(1,Math.min(20,Number(x.setCount)||3))}))};await put('templates',t);await reload();modal=null;editingTemplate=null;render();notify('Template saved')}
async function finish(){if(!active)return;const completed=active.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);if(!completed&&!confirm('Finish without any completed sets?'))return;await put('workouts',{...active,endedAt:new Date().toISOString()});active=null;await persistDraft();await reload();page='history';render();notify('Workout saved')}
async function exportData(){const data={app:'lift',version:1,exportedAt:new Date().toISOString(),exercises,templates,workouts,draft:active};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`lift-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){try{const data=JSON.parse(await file.text());if(data.app!=='lift'||!Array.isArray(data.exercises)||!Array.isArray(data.templates)||!Array.isArray(data.workouts))throw new Error('Invalid Lift backup');if(!confirm('Replace all local workout data with this backup?'))return;for(const store of ['exercises','templates','workouts']){await transact(store,'readwrite',os=>os.clear());for(const x of data[store])await put(store,x)}active=data.draft||null;await persistDraft();await put('state',{id:'initialized',value:true});await reload();modal=null;page='home';render();notify('Backup imported')}catch(e){alert('Could not import file: '+e.message)}}
const app=document.getElementById('app');document.addEventListener('input',e=>{const el=e.target;if(el.id==='exercise-search'){searchText=el.value;document.getElementById('exercise-results').innerHTML=exerciseChoices();return}if(el.matches('[data-template-sets]')){selectedIds[Number(el.dataset.templateSets)].setCount=Number(el.value)||1;return}if(el.matches('[data-set-input]')&&active){const [i,j,key]=el.dataset.setInput.split(':');const raw=el.value;active.items[+i].sets[+j][key]=raw===''?null:Number(raw);persistDraft()}});
document.addEventListener('click',async e=>{if(e.target.matches('[data-close-backdrop]')){modal=null;renderModal();return}const el=e.target.closest('[data-nav],[data-start],[data-start-blank],[data-view-workout],[data-new-template],[data-edit-template],[data-close-modal],[data-template-add],[data-template-remove],[data-save-template],[data-delete-template],[data-library],[data-new-exercise],[data-save-new-exercise],[data-pick-exercise],[data-delete-exercise],[data-add-workout-exercise],[data-remove-ex],[data-add-set],[data-remove-set],[data-check],[data-finish],[data-discard],[data-rename-workout],[data-save-name],[data-history-toggle],[data-delete-workout],[data-export],[data-import]');if(!el)return;const d=el.dataset;
if(d.nav){page=d.nav;render()}else if(d.start){await start(d.start)}else if('startBlank'in d){await start(null)}else if('viewWorkout'in d){page='workout';render()}else if('newTemplate'in d){templateEditor(null)}else if(d.editTemplate){templateEditor(templates.find(t=>t.id===d.editTemplate))}else if('closeModal'in d){modal=null;renderModal()}else if('templateAdd'in d){showModal('library-select',{target:'template'})}else if(d.templateRemove!==undefined){selectedIds.splice(Number(d.templateRemove),1);renderModal()}else if('saveTemplate'in d){await saveTemplate()}else if('deleteTemplate'in d){if(confirm('Delete this template?')){await del('templates',editingTemplate.id);editingTemplate=null;modal=null;await reload();render()}}else if('library'in d){showModal('library')}else if('newExercise'in d){showModal('new-exercise',{returnTarget:modal?.target||null})}else if('saveNewExercise'in d){const name=document.getElementById('new-ex-name').value.trim();if(!name)return notify('Enter an exercise name');let x=exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!x){x={id:uid(),name};await put('exercises',x);await reload()}const target=modal.returnTarget;modal=null;if(target==='template'){selectedIds.push({exerciseId:x.id,setCount:3});showModal('template')}else if(target==='workout'&&active){active.items.push({exerciseId:x.id,sets:Array.from({length:3},()=>({kg:null,reps:null,done:false}))});await persistDraft();render()}else{render();notify('Exercise added')}}else if(d.pickExercise){if(modal?.target==='template'){selectedIds.push({exerciseId:d.pickExercise,setCount:3});showModal('template')}else if(active){active.items.push({exerciseId:d.pickExercise,sets:Array.from({length:3},()=>({kg:null,reps:null,done:false}))});await persistDraft();modal=null;render()}}else if(d.deleteExercise){if(confirm('Delete this exercise from library? Existing logs will retain its ID but name will be unavailable.')){await del('exercises',d.deleteExercise);await reload();renderModal()}}else if('addWorkoutExercise'in d){showModal('library-select',{target:'workout'})}else if(d.removeEx!==undefined){if(confirm('Remove this exercise?')){active.items.splice(Number(d.removeEx),1);await persistDraft();render()}}else if(d.addSet!==undefined){const sets=active.items[+d.addSet].sets,last=sets.at(-1);sets.push({kg:last?.kg??null,reps:last?.reps??null,done:false});await persistDraft();render()}else if(d.removeSet!==undefined){const sets=active.items[+d.removeSet].sets;if(sets.length>1){sets.pop();await persistDraft();render()}}else if(d.check){const [i,j]=d.check.split(':').map(Number),set=active.items[i].sets[j];set.done=!set.done;await persistDraft();render()}else if('finish'in d){await finish()}else if('discard'in d){if(confirm('Discard this workout?')){active=null;await persistDraft();page='home';render()}}else if('renameWorkout'in d){showModal('rename')}else if('saveName'in d){const name=document.getElementById('workout-name').value.trim();if(name){active.name=name;await persistDraft();modal=null;render()}}else if(d.historyToggle){const x=document.getElementById('history-'+d.historyToggle);x.hidden=!x.hidden}else if(d.deleteWorkout){if(confirm('Permanently delete this workout?')){await del('workouts',d.deleteWorkout);await reload();render()}}else if('export'in d){await exportData()}else if('import'in d){document.getElementById('import-file').click()}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files[0]){await importData(e.target.files[0]);e.target.value=''}});
init().catch(e=>{console.error(e);app.innerHTML=`<div class="empty">Unable to open IndexedDB. Use a standard browser window, with storage enabled.<br>${escape(e.message)}</div>`});
})();
</script>
</body></html>
